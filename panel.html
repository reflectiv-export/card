<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel de ferias · Laura Gómez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ink:#0b1020; --ink-2:#3b4256; --muted:#6c7386; --line:#e7e9f0;
  --bg:#f4f5f9; --card:#ffffff; --field:#f5f6fa;
  --accent:#0d1a52; --accent-soft:#eef0f8; --blue:#0d1a52; --wa:#1a8a4a;
  --primary-bg:#0d1a52; --primary-fg:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 48px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logo{height:40px;display:flex;align-items:center;padding-right:6px;font-weight:800;letter-spacing:.16em;font-size:13px;color:#0f2233}
.ttl h1{font:400 30px/1 "Instrument Serif",Georgia,serif}
.ttl p{font-size:13px;color:var(--muted)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,.btn{font-family:inherit;font-size:14px;font-weight:700;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;cursor:pointer}
.btn.primary{background:var(--primary-bg);color:var(--primary-fg);border-color:transparent;text-decoration:none;display:inline-flex;align-items:center}
.updated{font-size:12px;color:var(--muted)}
.banner{background:var(--accent-soft);border:1px solid #d9ddec;border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.banner b{font-weight:800}
.error{background:rgba(200,60,60,.1);border-color:rgba(200,60,60,.4)}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.kpi .v{font:400 40px/1 "Instrument Serif",Georgia,serif;letter-spacing:-.01em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.kpi.hl{border-color:var(--accent)}

.grid{display:grid;gap:14px;margin-top:14px}
@media (min-width:900px){.grid.two{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
h2{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:right;font-size:12px;color:var(--muted);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line)}
td{text-align:right;padding:9px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
td b{font-weight:800}
.tbl{overflow-x:auto}

.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:140px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar .track{display:block;height:12px;background:var(--field);border-radius:999px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--blue);border-radius:999px}
.bar .n{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.bar .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.days{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.day .col{width:100%;max-width:34px;background:#c9cfe6;border-radius:6px 6px 2px 2px;min-height:2px}
.day .num{font-size:11px;font-weight:800;color:var(--ink-2)}
.day .d{font-size:10.5px;color:var(--muted);white-space:nowrap}
.day .lead{font-size:10px;font-weight:800;color:#fff;background:#4b5bab;border-radius:999px;padding:0 5px}

.leads{display:grid;gap:10px}
@media (min-width:760px){.leads{grid-template-columns:1fr 1fr}}
.lead{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--field)}
.lead .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lead .nm{font-weight:800;font-size:15px}
.lead .co{font-size:13px;color:var(--ink-2)}
.lead .st{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 8px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.lead .st.Pendiente{background:var(--accent-soft);border-color:#d3d8ea;color:var(--accent)}
.lead .meta{font-size:12.5px;color:var(--muted);margin-top:6px}
.lead .int{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.lead .int span{font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.lead .act{display:flex;gap:8px;margin-top:10px}
.lead .act a{color:var(--ink);flex:1;text-align:center;text-decoration:none;font-weight:800;font-size:13px;border-radius:10px;padding:9px 6px;background:var(--card);border:1px solid var(--line)}
.lead .act a.wa{color:var(--wa)}
</style>
</head>

    <div class="ttl"><h1>Panel de ferias</h1><p>Laura Gómez · tarjeta digital</p></div>
    <div class="tools">
      <select id="feria" aria-label="Feria"><option value="">Todas las ferias</option></select>
      <button class="btn" id="refresh">Actualizar</button>
      <a class="btn primary" id="sheet" href="#" target="_blank" rel="noopener" hidden>Abrir hoja</a>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <p class="updated" id="updated"></p>

  <section class="kpis" id="kpis"></section>

  <div class="grid two">
    <section class="card"><h2>Por feria</h2><div class="tbl" id="byFair"></div></section>
    <section class="card"><h2>Qué tocan en la tarjeta</h2><div class="bars" id="byEvent"></div></section>
  </div>
  <div class="grid">
    <section class="card"><h2>Visitas por día (últimos 14 días) · <span style="color:#4b5bab">●</span> leads</h2><div class="days" id="byDay"></div></section>
    <section class="card"><h2 id="leadsTitle">Leads</h2><div class="leads" id="leads"></div></section>
  </div>
</div>

<script>
(function () {
  /* ====== CONFIGURACIÓN ====== */
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbzmdduA6vMkB5gRsrLNoWnbnVu24KodKS-oWFJ6KbHQR7GGUQTM1DVYYqfS_8HFkv4/exec";   // URL /exec de Apps Script (la pone Claude)
  /* La llave va en la dirección: panel.html#k=TU_LLAVE  ·  Vista de ejemplo: panel.html#demo */

  const LABELS = { visita: "Abrieron la tarjeta", guardar_contacto: "Guardaron contacto", whatsapp: "WhatsApp", llamada: "Llamada", email: "Email",
    linkedin: "LinkedIn", catalogo: "Catálogo", llamada_oficina: "Tel. oficina", web_reflectiv: "Web Reflectiv", web_adheazy: "Web Adheazy",
    web_justnprint: "Web Just'N Print", web_rxppf: "Web RXPPF" };
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pretty = s => String(s || "").replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("es-ES", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }); };
  const hash = new URLSearchParams(location.hash.slice(1));
  const KEY = hash.get("k");
  const DEMO = hash.has("demo") || !ENDPOINT || !KEY;
  let DATA = { eventos: [], leads: [] };

  function banner(html, isError) { const b = $("#banner"); b.innerHTML = html; b.hidden = false; b.classList.toggle("error", !!isError); }

  async function load() {
    if (DEMO) {
      DATA = demoData();
      banner(!ENDPOINT
        ? "<b>Datos de ejemplo.</b> El panel se llena solo en cuanto conectes la Google Sheet (Apps Script)."
        : !KEY ? "<b>Falta la llave.</b> Abre el panel con la dirección que termina en <b>#k=…</b>. Mientras tanto ves datos de ejemplo."
        : "<b>Datos de ejemplo.</b>");
      render(); return;
    }
    try {
      $("#updated").textContent = "Cargando…";
      const r = await fetch(ENDPOINT + "?k=" + encodeURIComponent(KEY), { cache: "no-store" });
      const j = await r.json();
      if (!j.ok) throw new Error("respuesta inválida");
      DATA = j; $("#banner").hidden = true;
      if (j.hoja) { $("#sheet").href = j.hoja; $("#sheet").hidden = false; }
      render();
    } catch (e) {
      banner("<b>No se pudieron cargar los datos.</b> Revisa la conexión o que la llave sea correcta.", true);
      $("#updated").textContent = "";
    }
  }

  function render() {
    const f = $("#feria").value;
    const fairs = [...new Set([...DATA.eventos.map(r => r[1]), ...DATA.leads.map(r => r[1])].filter(Boolean))].sort();
    const sel = $("#feria");
    sel.innerHTML = '<option value="">Todas las ferias</option>' + fairs.map(x => `<option value="${esc(x)}"${x === f ? " selected" : ""}>${esc(pretty(x))}</option>`).join("");

    const ev = DATA.eventos.filter(r => !f || r[1] === f);
    const ld = DATA.leads.filter(r => !f || r[1] === f);
    const count = (rows, name) => rows.filter(r => r[2] === name).length;

    const visitas = count(ev, "visita"), guard = count(ev, "guardar_contacto"), wa = count(ev, "whatsapp");
    const conv = visitas ? Math.round(ld.length / visitas * 100) : 0;
    $("#kpis").innerHTML = [
      [visitas, "Abrieron la tarjeta"], [guard, "Guardaron tu contacto"], [wa, "Te escribieron por WhatsApp"],
      [ld.length, "Leads (dejaron sus datos)", "hl"], [conv + "%", "De visita a lead"]
    ].map(([v, l, c]) => `<div class="kpi ${c || ""}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");

    // por feria
    const rows = fairs.filter(x => !f || x === f).map(x => {
      const e = DATA.eventos.filter(r => r[1] === x);
      return [x, count(e, "visita"), count(e, "guardar_contacto"), count(e, "whatsapp"), DATA.leads.filter(r => r[1] === x).length];
    }).sort((a, b) => b[4] - a[4] || b[1] - a[1]);
    $("#byFair").innerHTML = rows.length
      ? `<table><thead><tr><th>Feria</th><th>Visitas</th><th>Guardaron</th><th>WhatsApp</th><th>Leads</th></tr></thead><tbody>${
          rows.map(r => `<tr><td>${esc(pretty(r[0]))}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><b>${r[4]}</b></td></tr>`).join("")}</tbody></table>`
      : '<p class="empty">Aún sin datos.</p>';

    // por evento (sin "visita")
    const byEv = {}; ev.forEach(r => { if (r[2] !== "visita") byEv[r[2]] = (byEv[r[2]] || 0) + 1; });
    const evs = Object.entries(byEv).sort((a, b) => b[1] - a[1]);
    const max = Math.max(1, ...evs.map(e => e[1]));
    $("#byEvent").innerHTML = evs.length
      ? evs.map(([k, n]) => `<div class="bar"><span class="lab">${esc(LABELS[k] || k)}</span><span class="track"><span class="fill" style="width:${n / max * 100}%"></span></span><span class="n">${n}</span></div>`).join("")
      : '<p class="empty">Aún nadie ha tocado ningún botón.</p>';

    // por día
    const days = [...Array(14)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 13 + i); return d; });
    const key = d => d.toISOString().slice(0, 10);
    const dayKey = iso => { const d = new Date(iso); d.setHours(0, 0, 0, 0); return key(d); };
    const vByDay = {}, lByDay = {};
    ev.filter(r => r[2] === "visita").forEach(r => { const k = dayKey(r[0]); vByDay[k] = (vByDay[k] || 0) + 1; });
    ld.forEach(r => { const k = dayKey(r[0]); lByDay[k] = (lByDay[k] || 0) + 1; });
    const dmax = Math.max(1, ...days.map(d => vByDay[key(d)] || 0));
    $("#byDay").innerHTML = days.map(d => {
      const k = key(d), v = vByDay[k] || 0, l = lByDay[k] || 0;
      return `<div class="day">${l ? `<span class="lead">${l}</span>` : ""}<span class="num">${v || ""}</span><span class="col" style="height:${v / dmax * 100}%"></span><span class="d">${d.toLocaleDateString("es-ES", { day: "numeric", month: "numeric" })}</span></div>`;
    }).join("");

    // leads
    $("#leadsTitle").textContent = `Leads (${ld.length})`;
    $("#leads").innerHTML = ld.length ? ld.slice().reverse().map(r => {
      const [fecha, feria, nombre, empresa, pais, contacto, interes, idioma, , seg] = r;
      const c = String(contacto || ""), digits = c.replace(/\D/g, "");
      const subj = encodeURIComponent("Reflectiv — " + pretty(feria));
      const acts = [];
      if (/@/.test(c)) acts.push(`<a href="mailto:${esc(c.trim())}?subject=${subj}">Email</a>`);
      if (digits.length >= 8 && !/@/.test(c)) acts.push(`<a class="wa" href="https://wa.me/${digits}" target="_blank" rel="noopener">WhatsApp</a>`, `<a href="tel:${esc(c.trim())}">Llamar</a>`);
      return `<div class="lead"><div class="top"><div><div class="nm">${esc(nombre)}</div><div class="co">${esc([empresa, pais].filter(Boolean).join(" · "))}</div></div><span class="st ${esc(seg)}">${esc(seg || "Pendiente")}</span></div>
        <div class="meta">${esc(c)} · ${esc(pretty(feria))} · ${fmtDate(fecha)}${idioma ? " · " + esc(String(idioma).toUpperCase()) : ""}</div>
        ${interes ? `<div class="int">${String(interes).split(",").map(s => `<span>${esc(s.trim())}</span>`).join("")}</div>` : ""}
        ${acts.length ? `<div class="act">${acts.join("")}</div>` : ""}</div>`;
    }).join("") : '<p class="empty">Aún sin leads.</p>';

    $("#updated").textContent = DEMO ? "" : "Actualizado " + new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }) + " · se refresca cada minuto";
  }

  function demoData() {
    let s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const fairs = ["fespa-2026", "batimat-2026"], evs = ["guardar_contacto", "whatsapp", "web_reflectiv", "email", "web_adheazy", "llamada", "web_rxppf"];
    const eventos = [], leads = [];
    for (let i = 0; i < 9; i++) {
      const day = new Date(); day.setDate(day.getDate() - 8 + i);
      const fair = i < 4 ? fairs[1] : fairs[0], n = 6 + Math.floor(rnd() * 22);
      for (let j = 0; j < n; j++) {
        const t = new Date(day); t.setHours(9 + Math.floor(rnd() * 9), Math.floor(rnd() * 60));
        eventos.push([t.toISOString(), fair, "visita", "es", "movil"]);
        if (rnd() < .55) eventos.push([t.toISOString(), fair, evs[Math.floor(rnd() * rnd() * evs.length)], "es", "movil"]);
      }
    }
    [["Marco Bianchi", "Vetri Bianchi Srl", "Italia", "marco@ejemplo.it", "Reflectiv, Adheazy", "it"],
     ["Ana Ferreira", "Decor Lisboa", "Portugal", "+351 912 000 000", "Adheazy", "pt"],
     ["Javier Ruiz", "Rótulos Ruiz", "España", "+34 600 000 000", "Just'N Print", "es"],
     ["Claire Martin", "Atelier Vitrage", "France", "claire@ejemplo.fr", "Reflectiv", "fr"],
     ["Tom Becker", "AutoFolien GmbH", "Deutschland", "tom@ejemplo.de", "RXPPF", "en"]]
      .forEach((l, i) => { const t = new Date(); t.setDate(t.getDate() - i * 2); leads.push([t.toISOString(), i < 3 ? fairs[0] : fairs[1], l[0], l[1], l[2], l[3], l[4], l[5], "Sí", i === 3 ? "Contactado" : "Pendiente"]); });
    return { eventos, leads };
  }

  $("#feria").addEventListener("change", render);
  $("#refresh").addEventListener("click", load);
  load();
  if (!DEMO) setInterval(load, 60000);
})();
</script>
